bookdown::gitbook:
  split_by: section
  css: style.css
  config:
    toc:
      collapse: subsection
      scroll_highlight: true
      before: |
        <li><a href="./">CS 598 PSL – A. Chronopoulou</a></li>
      after: |
        <li><a href="https://github.com/rstudio/bookdown" target="_blank">Published with bookdown</a></li>
    # edit: https://github.com/USERNAME/REPO/edit/main/%s   # ← uncomment & update later when on GitHub
    download: ["pdf", "epub"]          # optional: add pdf if you want the PDF download button
    fontsettings:
      theme: white
      family: sans-serif
      size: 2                         # 1 is quite small; 2 is usually better

bookdown::pdf_book:
  includes:
    in_header: preamble.tex
  latex_engine: xelatex
  citation_package: natbib
  keep_tex: yes

bookdown::epub_book: default